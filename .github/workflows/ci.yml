name: CampusResolve CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint checks
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Automated Unit & Service Tests
        run: npm run test

      - name: Production Vite Build
        run: npm run build
